# Builds, tests and deploys server/ to Azure App Service on every push to main that touches it.
# One-time setup: see server/DEPLOY_AZURE.md (repo secret AZURE_WEBAPP_PUBLISH_PROFILE).
name: Deploy server to Azure

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hisaab-api # the web app's name in Azure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (offline: memory database + mock AI)
        run: npm test

      - name: Keep only runtime dependencies
        run: npm prune --omit=dev

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: server
